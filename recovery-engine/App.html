<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recovery Engine</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#16211c;--mute:#5f6d67;--line:#dde4e0;--brand:#0b5d44;--brand2:#e5f2ec;
  --red:#b42318;--redbg:#fdecea;--amb:#9a5b06;--ambbg:#fff3dc;--grn:#13723a;--grnbg:#e6f5ea;--blu:#1d4ed8;--blubg:#e8eeff;--gry:#475467;--grybg:#eef1f0;
  --l-aisle:#7c3aed;--l-rack:#c2410c;--l-loc:#0e7490;--l-search:#64748b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1080px;margin:0 auto}.logo{font-weight:800;white-space:nowrap}.logo span{color:var(--brand)}
.bar select{flex:1;min-width:0;max-width:340px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff}
.who{margin-left:auto;font-size:12px;color:var(--mute);white-space:nowrap}
.tabs{display:flex;gap:2px;padding:0 12px;max-width:1080px;margin:0 auto;overflow-x:auto}
.tab{border:0;background:none;padding:10px 12px;color:var(--mute);font-weight:600;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}.tab.on{color:var(--brand);border-color:var(--brand)}
main{max-width:1080px;margin:0 auto;padding:12px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h1{font-size:18px;margin:0}h2{font-size:15px;margin:0 0 8px}h3{font-size:11px;margin:12px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
.sub{color:var(--mute);font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grow{flex:1;min-width:0}.right{text-align:right}
.steps{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}.step{flex:1;min-width:120px;border-radius:10px;padding:8px 10px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mute)}
.step b{display:block;color:var(--ink);font-size:13px}.step.on{border-color:var(--brand);box-shadow:inset 0 -3px 0 var(--brand)}.step.done{background:var(--brand2)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 10px}.kpi b{display:block;font-size:19px}.kpi small{color:var(--mute);font-size:11px}
.chip{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;white-space:nowrap;vertical-align:middle}
.c-red{background:var(--redbg);color:var(--red)}.c-amb{background:var(--ambbg);color:var(--amb)}.c-grn{background:var(--grnbg);color:var(--grn)}.c-blu{background:var(--blubg);color:var(--blu)}.c-gry{background:var(--grybg);color:var(--gry)}
.lv{color:#fff}.lv-AISLE{background:var(--l-aisle)}.lv-RACK{background:var(--l-rack)}.lv-LOCATION{background:var(--l-loc)}.lv-SEARCH{background:var(--l-search)}
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--grybg);margin:8px 0 4px}.stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute)}.legend span:before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;background:var(--c)}
.hero{border-left:4px solid var(--brand);background:var(--brand2);border-radius:8px;padding:10px 12px;margin-top:10px}.hero b{font-size:15px}
.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}.btn.ghost{background:var(--brand2);color:var(--brand)}.btn.sm{padding:5px 9px;font-size:12px}.btn:disabled{opacity:.45;cursor:not-allowed}
.list>div{display:flex;gap:10px;align-items:center;padding:9px 2px;border-top:1px solid var(--line)}.click{cursor:pointer}.click:hover{background:#f8fbf9}
.crew{display:grid;grid-template-columns:24px 1fr 84px;gap:8px;align-items:center;padding:8px 2px;border-top:1px solid var(--line)}.crew.off{opacity:.55}
.crew select,.field input,.field select,.field textarea,.inline input,.inline select{padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;width:100%}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.field label{font-size:12px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.triad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.triad>div{border:1px solid var(--line);border-radius:10px;padding:10px}.triad b{font-size:17px;display:block}
.sumbar{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);margin:12px -14px -14px;padding:10px 14px;border-radius:0 0 12px 12px}
.cap{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:600;background:#f8faf9}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:8px}
.banner{border-radius:8px;padding:8px 12px;margin-bottom:8px;font-size:13px}.banner.amb{background:var(--ambbg);color:var(--amb)}.banner.red{background:var(--redbg);color:var(--red)}.banner.blu{background:var(--blubg);color:var(--blu)}
.modal{position:fixed;inset:0;background:rgba(10,20,15,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}.sheet{background:#fff;width:100%;max-width:820px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#16211c;color:#fff;padding:10px 14px;border-radius:10px;z-index:30;max-width:90vw}.toast.err{background:var(--red)}
details summary{cursor:pointer;font-weight:600;font-size:13px;padding:6px 0}ol{margin:4px 0 0 18px;padding:0}li{margin:2px 0}
.inline{display:grid;grid-template-columns:1fr 90px;gap:8px;align-items:center}
@media(max-width:720px){.sumbar .triad{grid-template-columns:repeat(3,1fr);gap:6px}.sumbar .triad>div{padding:6px}.sumbar .triad b{font-size:14px}.sumbar .triad .sub{font-size:10px}.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.triad{grid-template-columns:1fr}.who{display:none}main{padding:10px 12px 90px}.hide-m{display:none}}
</style>
</head>
<body>
<div class="top"><div class="bar"><div class="logo">Recovery <span>Engine</span></div><select id="store" aria-label="Store"></select><div class="who" id="who"></div></div><div class="tabs" id="tabs"></div></div>
<main id="main"><div class="card">Loading…</div></main>
<script>
<?!= coreSrc ?>
var REC = RE_CORE_FACTORY();
</script>
<script>
(function () {
'use strict';
const INITIAL = '<?= initialStore ?>';
const S = {boot: null, d: null, outlet: '', view: 'today', crew: [], skip: {}, showAll: false, cm: null, cmOpen: '', tower: null, extra: ''};
const $ = id => document.getElementById(id);
const esc = x => String(x === null || x === undefined ? '' : x).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const rs = x => (x === null || x === undefined || isNaN(Number(x))) ? '–' : '₹' + Math.round(Number(x)).toLocaleString('en-IN');
const n1 = x => (x === null || x === undefined || isNaN(Number(x))) ? '–' : (Math.round(Number(x) * 10) / 10).toString();
const pct = x => x === null || x === undefined ? '–' : x + '%';
const em = e => (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, '').replace(/^RE:\s*/, '');
function api(fn, arg) {
  return new Promise((ok, bad) => {
    if (window.google && google.script && google.script.run) google.script.run.withSuccessHandler(ok).withFailureHandler(bad)[fn](arg);
    else if (window.RE_MOCK && RE_MOCK[fn]) setTimeout(() => { try { ok(RE_MOCK[fn](arg)); } catch (e) { bad(e); } }, 60);
    else bad(new Error('No server'));
  });
}
function toast(m, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 2500); }
const TONE = {BROKEN: 'c-red', AT_RISK: 'c-amb', SORTED: 'c-grn', CONTROL: 'c-blu', P0: 'c-red', P1: 'c-red', P2: 'c-amb', P3: 'c-amb', P4: 'c-gry', EV: 'c-blu',
  A: 'c-grn', B: 'c-blu', C: 'c-gry', NEW: 'c-gry', PROXY: 'c-gry', FOUND: 'c-grn', CLEARED: 'c-grn', OPEN: 'c-amb', NOT_IN_FEED: 'c-gry', BETTER: 'c-grn', SUSTAINED: 'c-grn',
  WORSE: 'c-red', RELAPSED: 'c-red', FLAT: 'c-gry', PENDING: 'c-gry', NO_DATA: 'c-gry', NO_BASELINE: 'c-gry', NO_PLAN: 'c-amb', NO_ACTUALS: 'c-red', LOW_ADHERENCE: 'c-red',
  LOW_EXECUTION: 'c-red', NO_YIELD: 'c-amb', IN_PROGRESS: 'c-blu', ON_TRACK: 'c-grn', PILFERAGE: 'c-red', MISPLACED: 'c-amb', AUDIT_GAP: 'c-blu', OTHER: 'c-gry'};
const chip = (s, l) => '<span class="chip ' + (TONE[s] || 'c-gry') + '">' + esc(l || String(s).replace(/_/g, ' ')) + '</span>';
const lv = t => '<span class="chip lv lv-' + t.level + '">' + esc(t.label) + '</span>';
const SRC = {PILFERAGE: 'Pilferage-prone', MISPLACED: 'Misplaced (went negative at pick)', AUDIT_GAP: 'Never audited', OTHER: 'Other'};
const LVC = {AISLE: 'var(--l-aisle)', RACK: 'var(--l-rack)', LOCATION: 'var(--l-loc)', SEARCH: 'var(--l-search)'};

// ---------------------------------------------------------------- boot / load
function start() {
  api('RE_BOOT').then(b => {
    S.boot = b;
    const sel = $('store');
    sel.innerHTML = b.stores.map(s => '<option value="' + esc(s.outlet_id) + '">' + esc(s.outlet_id + ' · ' + s.outlet_name.replace(/^SS |^LT /, '') + ' · ' + s.region) + '</option>').join('');
    const init = INITIAL && INITIAL.indexOf('<?') < 0 ? INITIAL : '';
    S.outlet = b.stores.some(s => s.outlet_id === init) ? init : (b.stores[0] || {}).outlet_id;
    sel.value = S.outlet;
    sel.onchange = () => { S.outlet = sel.value; S.view = S.view === 'cm' || S.view === 'tower' ? 'today' : S.view; load(); };
    $('who').textContent = b.me + ' · ' + b.role;
    if (!b.stores.length) { $('main').innerHTML = '<div class="card">No stores found. Check pilot_outlets in CFG.</div>'; return; }
    if (b.role === 'PM' && !init) S.view = 'tower'; else if (b.role === 'CM' && !init) S.view = 'cm';
    if (S.view === 'today') load(); else render();
  }).catch(e => { $('main').innerHTML = '<div class="card"><h2>Could not start</h2><p>' + esc(em(e)) + '</p></div>'; });
}
function load() {
  $('main').innerHTML = '<div class="card">Loading store ' + esc(S.outlet) + '…</div>';
  api('RE_STORE', S.outlet).then(d => { setStore(d); render(); }).catch(e => { S.d = null; render(); toast(em(e), true); });
}
function setStore(d) {
  S.d = d; S.skip = {}; S.showAll = false;
  S.crew = d.roster.map(c => { const s = d.suggestion.crew.find(x => x.name === c.name); return {name: c.name, on: !!s, hours: s ? s.hours : d.settings.max_hours_per_captain}; });
}
function tabs() {
  const r = S.boot.role, t = [['today', 'Today'], ['history', 'Store results']];
  if (r !== 'SM') t.push(['cm', 'Cluster review']);
  if (r === 'PM') t.push(['tower', 'Control tower']);
  $('tabs').innerHTML = t.map(x => '<button class="tab' + (S.view === x[0] ? ' on' : '') + '" data-v="' + x[0] + '">' + x[1] + '</button>').join('');
  document.querySelectorAll('.tab').forEach(b => { b.onclick = () => { S.view = b.dataset.v; if ((S.view === 'today' || S.view === 'history') && !S.d) load(); else render(); }; });
}
function render() {
  tabs();
  const v = S.view;
  if (v === 'cm' && !S.cm) { $('main').innerHTML = '<div class="card">Loading cluster…</div>'; api('RE_CM').then(q => { S.cm = q; render(); }).catch(e => toast(em(e), true)); return; }
  if (v === 'tower' && !S.tower) { $('main').innerHTML = '<div class="card">Loading control tower…</div>'; api('RE_TOWER').then(q => { S.tower = q; render(); }).catch(e => toast(em(e), true)); return; }
  if ((v === 'today' || v === 'history') && !S.d) { $('main').innerHTML = '<div class="card">Store could not be loaded.</div>'; return; }
  $('main').innerHTML = v === 'today' ? today() : v === 'history' ? history() : v === 'cm' ? cluster() : tower();
  wire();
}

// ---------------------------------------------------------------- planning maths (same Core as the server)
function myCrew() { return S.crew.filter(c => c.on && c.name.trim()).map(c => ({name: c.name.trim(), hours: Number(c.hours)})); }
function plans() {
  const d = S.d;
  return {sugg: REC.allocate(d.diagnosis.tasks, d.suggestion.crew, d.roster, []), mine: REC.allocate(d.diagnosis.tasks, myCrew(), d.roster, Object.keys(S.skip))};
}
const deviates = p => JSON.stringify(p.sugg.lines) !== JSON.stringify(p.mine.lines);

// ---------------------------------------------------------------- Today
function stepStrip(stage) {
  const st = [['Diagnose', 'what is broken'], ['Plan', 'crew + hours'], ['Execute', 'captain briefs'], ['Close & measure', 'actual vs plan']];
  return '<div class="steps">' + st.map((x, i) => '<div class="step' + (i === stage ? ' on' : i < stage ? ' done' : '') + '"><b>' + (i + 1) + '. ' + x[0] + '</b>' + x[1] + '</div>').join('') + '</div>';
}
function today() {
  const d = S.d, tp = d.today_plan;
  let h = '';
  if (d.freshness.status !== 'CURRENT') h += '<div class="banner amb">' + esc(d.freshness.label) + '. Check that RAWItemlevel refreshed today.</div>';
  if (tp) {
    const logged = tp.measure.actual.logged;
    h += stepStrip(logged ? 3 : 2) + execute(tp) + closeShift(tp) + (logged ? measureCard(tp.measure, true) : '');
    h += '<div class="card"><details><summary>Re-plan today (replaces ' + esc(tp.plan.plan_id) + ')</summary>' + diagnoseCard() + planCard(true) + '</details></div>';
    return h;
  }
  return h + stepStrip(S.planning ? 1 : 0) + diagnoseCard() + planCard(false);
}

function diagnoseCard() {
  const d = S.d, s = d.store, sev = d.severity, g = d.diagnosis, bl = g.by_level, mode = bl[g.mode];
  const total = Object.keys(bl).reduce((v, k) => v + bl[k].value, 0) || 1;
  const modeText = {AISLE: 'Aisle reset: variance is spread across whole aisles, so item-by-item search will not hold.',
    RACK: 'Rack sweep: variance clusters in a few racks. Sweep those racks fully instead of chasing items.',
    LOCATION: 'Targeted item recovery: variance is scattered. Check the exact NEG / probable locations.'}[g.mode];
  let h = '<div class="card"><div class="row"><div class="grow"><h1>' + esc(s.outlet_name) + '</h1><div class="sub">' + esc([s.outlet_id, s.region, s.cm_sm, 'feed ' + d.summary.feed_date].filter(Boolean).join(' · ')) + '</div></div>' +
    (s.cohort ? chip(s.cohort, 'Pilot: ' + s.cohort) + ' ' : '') + chip(sev.tier) + '</div>' +
    (sev.reasons.length ? '<div class="sub" style="margin-top:4px">Why ' + esc(sev.tier.replace('_', ' ').toLowerCase()) + ': ' + esc(sev.reasons.join(' · ')) + '</div>' : '') +
    '<div class="kpis"><div class="kpi"><b>' + rs(d.summary.total_absolute_pending) + '</b><small>absolute pending</small></div>' +
    '<div class="kpi"><b>' + d.summary.priority_counts.P0 + '</b><small>fresh negatives (T-1)</small></div>' +
    '<div class="kpi"><b>' + d.summary.worklist_skus + '</b><small>SKUs on worklist · ' + rs(d.summary.worklist_value) + '</small></div>' +
    '<div class="kpi"><b>' + n1(g.total_hours) + ' h</b><small>to clear everything</small></div></div>' +
    '<div class="hero"><div class="sub">Recommended recovery</div><b>' + esc(mode.label) + '</b> · ' + mode.share_pct + '% of variance ₹<div class="sub" style="margin-top:2px">' + esc(modeText) + '</div></div>' +
    '<div class="stack">' + Object.keys(bl).map(k => bl[k].value ? '<i style="width:' + (100 * bl[k].value / total) + '%;background:' + LVC[k] + '" title="' + esc(bl[k].label) + '"></i>' : '').join('') + '</div>' +
    '<div class="legend">' + Object.keys(bl).filter(k => bl[k].tasks).map(k => '<span style="--c:' + LVC[k] + '">' + esc(bl[k].label) + ' ' + bl[k].tasks + ' · ' + bl[k].share_pct + '%</span>').join('') + '</div>';
  if (g.full_recon) h += '<div class="banner red" style="margin-top:10px"><b>' + g.broken_aisles + ' broken aisles.</b> Daily recovery will not catch up. Ask your CM for a full inventory reconciliation.</div>';
  if (g.sources.length) h += '<h3>Where the variance comes from (provisional)</h3><div class="row">' + g.sources.map(x => chip(x.source, (SRC[x.source] || x.source) + ' · ' + x.items + ' · ' + rs(x.value))).join(' ') + '</div>' +
    (g.sources.some(x => x.source === 'PILFERAGE') ? '<div class="sub" style="margin-top:4px">Pilferage-prone items: create a location audit on their locations every day, not only on recovery days.</div>' : '');
  h += '<h3>What to fix, in order</h3><div class="list">' + g.tasks.slice(0, S.showAll ? 999 : 6).map(t => taskRow(t, false)).join('') + '</div>' +
    (g.tasks.length > 6 && !S.showAll ? '<button class="btn ghost sm" data-act="showall" style="margin-top:8px">Show all ' + g.tasks.length + '</button>' : '') + '</div>';
  return h;
}
function taskRow(t, withSkip) {
  return '<div><div class="grow click" data-task="' + esc(t.task_id) + '">' + lv(t) + ' <b class="mono">' + esc(t.level === 'SEARCH' ? '' : t.target) + '</b> ' + (t.level === 'SEARCH' ? '<b>' + esc(t.target) + '</b> ' : '') + chip(t.best_priority) +
    '<div class="sub">' + esc(t.reason) + '</div><div class="sub">' + t.item_count + ' items · ' + (t.location_count ? t.location_count + ' locations · ' : '') + n1(t.est_hours) + ' h</div></div>' +
    '<div class="right"><b>' + rs(t.value) + '</b>' + (withSkip ? '<div><button class="btn sm ' + (S.skip[t.task_id] ? '' : 'ghost') + '" data-skip="' + esc(t.task_id) + '">' + (S.skip[t.task_id] ? 'Skipped' : 'Skip') + '</button></div>' : '') + '</div></div>';
}

function planCard(replace) {
  const d = S.d, p = plans(), sg = p.sugg, mi = p.mine, dev = deviates(p);
  const byName = {};
  d.roster.forEach(r => { byName[r.name] = r; });
  const shown = S.crew.filter((c, i) => S.showCrew || c.on || i < 8);
  let h = '<div class="card"><h2>Plan today\'s recovery</h2><p class="sub">The engine has picked your strongest auditors who were present yesterday and split the work. ' +
    'Change anything: you know your floor. Your plan is yours; the suggestion is only recorded for comparison.</p>' +
    (d.store.low_order_window ? '<div class="banner blu">Best window for this store: <b>' + esc(d.store.low_order_window) + '</b> (lowest orders).</div>' : '') +
    '<h3>Crew · suggested ' + n1(d.suggestion.budget_hours) + ' h</h3>' +
    shown.map(c => {
      const r = byName[c.name] || {}, i = S.crew.indexOf(c);
      const stats = r.rated ? 'IAPH ' + n1(r.iaph) + ' · bad ' + (r.bad_audit_pct === null ? '–' : r.bad_audit_pct + '%') + ' · ' + r.audits_30d + ' audits' : esc(r.basis || '');
      return '<div class="crew' + (c.on ? '' : ' off') + '"><input type="checkbox" data-con="' + i + '"' + (c.on ? ' checked' : '') + ' aria-label="Use ' + esc(c.name) + '">' +
        '<div><b>' + esc(c.name) + '</b> ' + chip(r.tier || 'NEW', !r.tier || r.tier === 'NEW' ? 'unrated' : r.tier === 'PROXY' ? 'proxy' : 'Tier ' + r.tier) + (r.complex_ready ? ' ' + chip('A', 'sweeps') : '') + (r.present_t1 === false ? ' ' + chip('C', 'not in T-1') : '') +
        '<div class="sub">' + (r.score ? 'Score ' + r.score + ' · ' : '') + stats + (r.designation ? ' · ' + esc(r.designation) : '') + '</div></div>' +
        '<select data-chours="' + i + '"' + (c.on ? '' : ' disabled') + '>' + hourOpts(c.hours) + '</select></div>';
    }).join('') +
    (S.crew.length > shown.length ? '<button class="btn ghost sm" data-act="showcrew">Show all ' + S.crew.length + ' captains</button> ' : '') +
    '<div class="row" style="margin-top:8px"><input id="extra" placeholder="Add a captain not listed" value="' + esc(S.extra) + '" style="flex:1;padding:7px 8px;border:1px solid var(--line);border-radius:8px"><button class="btn ghost sm" data-act="addcrew">Add</button></div>';
  if (mi.complex_without_ready) h += '<div class="banner amb" style="margin-top:10px">No captain in your crew is cleared for rack/aisle sweeps (bad-audit % above limit or not approved). Sweeps are still assigned; expect lower accuracy.</div>';
  if (mi.hours && mi.used_hours < mi.hours - 0.5) h += '<div class="banner amb" style="margin-top:10px">' + n1(mi.hours - mi.used_hours) + ' h of crew time has no work: there are fewer tasks than hours. Reduce hours and use them elsewhere.</div>';
  h += '<h3>Tasks · skip what you cannot do today</h3><div class="list">' + d.diagnosis.tasks.slice(0, 12).map(t => taskRow(t, true)).join('') + '</div>' +

    '<div><span class="sub">Suggested</span><b>' + n1(sg.used_hours) + ' h</b><span class="sub">' + sg.crew.length + ' captains · ' + sg.locations + ' loc · ' + rs(sg.value) + '</span></div>' +

    (dev ? '<div class="field"><label>Your plan differs from the suggestion. Why? (your CM sees this)</label><select id="dev"><option value="">Choose a reason</option>' + S.boot.deviation_reasons.map(x => '<option' + (S.dev === x ? ' selected' : '') + '>' + esc(x) + '</option>').join('') + '</select></div>' : '') +

}
function hourOpts(v) { let o = ''; for (let x = 0.5; x <= S.d.settings.max_hours_per_captain + 1e-6; x += 0.5) o += '<option value="' + x + '"' + (Math.abs(x - v) < 1e-6 ? ' selected' : '') + '>' + x + ' h</option>'; return o; }
function crewSplit(plan, tasks) {
  const byId = {};
  tasks.forEach(t => { byId[t.task_id] = t; });
  if (!plan.lines.length) return '<div class="sub">Tick at least one captain.</div>';
  return plan.crew.filter(c => c.used > 0).map(c => '<div class="cap"><div class="row"><b class="grow">' + esc(c.name) + '</b><span class="sub">' + n1(c.used) + ' of ' + n1(c.hours) + ' h</span></div>' +
    plan.lines.filter(l => l.captain === c.name).map(l => { const t = byId[l.task_id]; return '<div class="sub">' + lv(t) + ' ' + esc(t.level === 'SEARCH' ? t.target : t.target) + (l.share < 0.99 ? ' · ~' + Math.round(l.share * 100) + '% of it' : '') + ' · ' + n1(l.hours) + ' h</div>'; }).join('') + '</div>').join('');
}

// ---------------------------------------------------------------- Execute
function execute(tp) {
  const d = S.d, p = tp.plan, byId = {}, caps = [];
  tp.tasks.forEach(t => { byId[t.task_id] = t; });
  tp.lines.forEach(l => { if (caps.indexOf(l.captain) < 0) caps.push(l.captain); });
  let h = '<div class="card"><div class="row"><div class="grow"><h2 style="margin:0">Today\'s plan · ' + esc(p.plan_id) + '</h2><div class="sub">Confirmed ' + esc(p.confirmed_at) + ' by ' + esc(p.confirmed_by) + (p.window ? ' · window ' + esc(p.window) : '') +
    (p.deviation_reason ? ' · changed from suggestion: ' + esc(p.deviation_reason) : '') + '</div></div>' + chip('ON_TRACK', 'CONFIRMED') + '</div>' +
    '<p class="sub">Send each captain their brief. Rack and aisle sweeps: create the location audits on your HHD first, then assign.</p>';
  caps.forEach(c => {
    const mine = tp.lines.filter(l => l.captain === c), hrs = mine.reduce((v, l) => v + l.hours, 0);
    h += '<div class="cap"><div class="row"><b class="grow">' + esc(c) + '</b><span class="sub">' + n1(hrs) + ' h</span><button class="btn sm ghost" data-brief="' + esc(c) + '">Copy WhatsApp brief</button></div>' +
      mine.map(l => { const t = byId[l.task_id]; if (!t) return ''; return '<details><summary>' + lv(t) + ' ' + esc(t.target) + (l.share < 0.99 ? ' · ~' + Math.round(l.share * 100) + '%' : '') + ' · ' + n1(l.hours) + ' h</summary>' + taskDetail(t) + '</details>'; }).join('') + '</div>';
  });

}
function taskDetail(t) {

  return '<div class="sub" style="margin:4px 0">' + esc(t.reason) + '</div>' +
    (t.level === 'LOCATION' ? '<div class="mono">' + t.location_list.map(x => esc(x.location_id) + (x.type === 'NEG' ? ' (NEG, first)' : '')).join('<br>') + '</div>' : '') +
    (t.items.length ? '<table style="margin-top:6px"><tr><th>Item to look for</th><th class="right">Qty</th><th class="right">₹</th></tr>' + t.items.slice(0, 15).map(x => '<tr><td>' + esc(x.item_name) + (t.level === 'SEARCH' && x.upc ? '<div class="sub mono">UPC ' + esc(x.upc) + '</div>' : '') + '</td><td class="right">' + n1(x.variance_qty) + '</td><td class="right">' + rs(x.variance) + '</td></tr>').join('') + '</table>' : '') +

}

// ---------------------------------------------------------------- Close shift
function closeShift(tp) {

  let h = '<div class="card"><h2>Close the shift' + (m.actual.logged ? ' · logged' : '') + '</h2><p class="sub">Enter what actually happened. This is the "actual" in suggested vs planned vs actual. Audit data is checked separately.</p>';
  caps.forEach((c, i) => {

    h += '<div class="cap" data-cap="' + esc(c) + '"><div class="inline"><b>' + esc(c) + ' <span class="sub">planned ' + n1(planned) + ' h</span></b><input type="number" step="0.25" min="0" max="12" data-ah="' + i + '" value="' + (a.actual_hours !== undefined ? a.actual_hours : '') + '" placeholder="hours"></div>' +
      mine.map(l => { const t = byId[l.task_id], v = (a.tasks || {})[l.task_id] || ''; return '<div class="inline" style="margin-top:6px"><span class="sub">' + lv(t) + ' ' + esc(t.target) + '</span><select data-ts="' + i + '" data-tid="' + esc(l.task_id) + '">' +
        ['', 'DONE', 'PARTIAL', 'NOT_DONE'].map(x => '<option value="' + x + '"' + (x === v ? ' selected' : '') + '>' + (x ? x.replace('_', ' ').toLowerCase() : 'status') + '</option>').join('') + '</select></div>'; }).join('') +
      '<input data-note="' + i + '" placeholder="Note (optional)" value="' + esc(a.note || '') + '" style="margin-top:6px;width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:8px"></div>';

}

// ---------------------------------------------------------------- Measure

  let h = '<div class="card"><div class="row"><h2 class="grow" style="margin:0">Suggested vs planned vs actual · ' + esc(m.plan_date) + '</h2>' + chip(o.overall) + '</div>' +
    '<div class="triad" style="margin-top:10px"><div><span class="sub">Suggested</span><b>' + n1(m.suggested.hours) + ' h</b><span class="sub">' + m.suggested.captains + ' captains · ' + m.suggested.tasks + ' tasks</span></div>' +
    '<div><span class="sub">Planned</span><b>' + n1(m.planned.hours) + ' h</b><span class="sub">' + m.planned.captains + ' captains · ' + m.planned.tasks + ' tasks · ' + pct(a.plan_vs_suggested_hours_pct) + ' of suggested</span></div>' +
    '<div><span class="sub">Actual (SM log)</span><b>' + (m.actual.logged ? n1(m.actual.hours) + ' h' : 'not logged') + '</b><span class="sub">' + (m.actual.logged ? pct(a.actual_vs_planned_hours_pct) + ' of planned · ' + n1(m.actual.tasks_done) + ' tasks done' : 'close the shift to fill this') + '</span></div></div>' +

    '<div class="kpi"><b>' + r.recovered_items + ' / ' + r.planned_items + '</b><small>items recovered (feed) · ' + rs(r.recovered_value) + '</small></div>' +
    '<div class="kpi"><b>' + rs(m.rupees_per_hour) + '</b><small>recovered per actual man-hour</small></div></div>' +
    (m.deviation_reason ? '<div class="sub" style="margin-top:8px">SM changed the suggestion: ' + esc(m.deviation_reason) + '</div>' : '');
  if (full && S.d && S.d.nudge) h += '<div class="banner blu" style="margin-top:10px">' + esc(S.d.nudge) + '</div>';
  if (full) h += '<h3>Store variance after recovery</h3><table><tr><th>Check</th><th class="right">Absolute pending</th><th class="right">vs baseline</th><th>State</th></tr>' +
    '<tr><td>Baseline ' + esc(o.baseline ? o.baseline.date : '') + '</td><td class="right">' + (o.baseline ? rs(o.baseline.value) : '–') + '</td><td></td><td></td></tr>' +
    [['T+' + S.boot.settings.t3_offset, o.t3], ['T+' + S.boot.settings.t7_offset, o.t7]].map(x => '<tr><td>' + x[0] + ' · ' + esc(x[1].date) + '</td><td class="right">' + rs(x[1].value) + '</td><td class="right">' + (x[1].change_pct === undefined || x[1].change_pct === null ? '–' : x[1].change_pct + '%') + '</td><td>' + chip(x[1].state) + '</td></tr>').join('') + '</table>' +
    '<p class="sub">Recovered = the variance feed shows an audit increment after the plan date, or the item\'s variance cleared. SM logs never count as recovery.</p>';
  if (full && r.items.length) h += '<details><summary>Planned items (' + r.items.length + ')</summary><div class="scroll"><table><tr><th>Item</th><th>Status</th><th class="right">₹ at plan</th><th class="right">₹ now</th></tr>' +
    r.items.map(x => '<tr><td>' + chip(x.priority) + ' ' + esc(x.item_name) + '</td><td>' + chip(x.status) + '</td><td class="right">' + rs(x.baseline_variance) + '</td><td class="right">' + (x.current_variance === null ? '–' : rs(x.current_variance)) + '</td></tr>').join('') + '</table></div></details>';
  return h + '</div>';

function history() {
  const hs = S.d.history;
  if (!hs.length) return '<div class="card"><h2>No plans yet</h2><p class="sub">Results appear after the first confirmed plan.</p></div>';

// ---------------------------------------------------------------- actions
function taskSheet(id) {
  const t = S.d.diagnosis.tasks.find(x => x.task_id === id);
  if (!t) return;
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = '<div class="sheet"><div class="row"><div class="grow">' + lv(t) + ' <b class="mono">' + esc(t.target) + '</b> ' + chip(t.best_priority) + '</div><button class="btn ghost sm" data-close="1">Close</button></div>' +
    '<div class="sub" style="margin:6px 0">' + t.item_count + ' items · ' + rs(t.value) + ' · ' + (t.location_count ? t.location_count + ' locations · ' : '') + n1(t.est_hours) + ' h</div>' + taskDetail(t) + '</div>';
  m.onclick = e => { if (e.target === m || e.target.dataset.close) m.remove(); };
  document.body.appendChild(m);
}
function copy(txt) {
  const done = () => toast('Brief copied. Paste it in WhatsApp.');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallback());
  else fallback();
  function fallback() { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copy failed', true); } ta.remove(); }
}
function doConfirm(btn) {
  const p = plans(), dev = deviates(p);
  if (dev && !($('dev') && $('dev').value)) { toast('Pick a reason for changing the suggestion.', true); return; }
  btn.disabled = true; btn.textContent = 'Confirming…';
  api('RE_CONFIRM', {outlet_id: S.outlet, feed_date: S.d.summary.feed_date, crew: myCrew(), skip: Object.keys(S.skip), deviation_reason: dev ? $('dev').value : '',
    window: $('win') ? $('win').value : '', replace_reason: $('repl') ? $('repl').value : ''})
    .then(r => { setStore(r.view); S.cm = null; S.tower = null; S.planning = false; render(); window.scrollTo(0, 0); toast('Plan ' + r.plan_id + ' confirmed'); })
    .catch(e => { btn.disabled = false; btn.textContent = 'Confirm plan'; toast(em(e), true); });
}
function doActuals(btn) {
  const tp = S.d.today_plan, rows = [];
  document.querySelectorAll('[data-cap]').forEach((el, i) => {
    const h = el.querySelector('[data-ah]').value, tasks = {};
    el.querySelectorAll('[data-ts]').forEach(s => { if (s.value) tasks[s.dataset.tid] = s.value; });
    if (h === '' && !Object.keys(tasks).length) return;
    rows.push({captain: el.dataset.cap, actual_hours: h === '' ? 0 : Number(h), tasks, note: el.querySelector('[data-note]').value});
  });
  if (!rows.length) { toast('Enter hours for at least one captain.', true); return; }
  btn.disabled = true;
  api('RE_ACTUALS', {plan_id: tp.plan.plan_id, rows}).then(d => { setStore(d); S.cm = null; S.tower = null; render(); toast('Actuals saved'); }).catch(e => { btn.disabled = false; toast(em(e), true); });
}
function wire() {
  const q = (s, f) => document.querySelectorAll(s).forEach(f);
  q('[data-task]', el => { el.onclick = () => taskSheet(el.dataset.task); });
  q('[data-skip]', el => { el.onclick = () => { const id = el.dataset.skip; if (S.skip[id]) delete S.skip[id]; else S.skip[id] = true; S.planning = true; keep(render); }; });
  q('[data-con]', el => { el.onchange = () => { S.crew[+el.dataset.con].on = el.checked; S.planning = true; keep(render); }; });
  q('[data-chours]', el => { el.onchange = () => { S.crew[+el.dataset.chours].hours = Number(el.value); S.planning = true; keep(render); }; });
  q('[data-brief]', el => { el.onclick = () => { const tp = S.d.today_plan; copy(REC.captainBrief(el.dataset.brief, {lines: tp.lines}, tp.tasks, S.d.sops, S.d.store.outlet_name, tp.plan.window)); }; });
  q('[data-cm]', el => { el.onclick = () => { S.cmOpen = el.dataset.cm; render(); const p = $('cmpanel'); if (p) p.scrollIntoView({behavior: 'smooth'}); }; });
  q('[data-open]', el => { el.onclick = () => { S.outlet = el.dataset.open; $('store').value = S.outlet; S.view = 'today'; load(); }; });
  if ($('dev')) $('dev').onchange = () => { S.dev = $('dev').value; };
  if ($('win')) $('win').oninput = () => { S.win = $('win').value; };
  if ($('extra')) $('extra').oninput = () => { S.extra = $('extra').value; };
  q('[data-act]', b => {
    const a = b.dataset.act;
    b.onclick = () => {
      if (a === 'showall') { S.showAll = true; render(); }
      else if (a === 'showcrew') { S.showCrew = true; keep(render); }
      else if (a === 'addcrew') {
        const nm = (S.extra || '').trim();
        if (!nm) return;
        if (S.crew.some(c => c.name.toLowerCase() === nm.toLowerCase())) { toast(nm + ' is already listed', true); return; }
        S.crew.push({name: nm, on: true, hours: S.d.settings.max_hours_per_captain}); S.extra = ''; S.planning = true; keep(render);
      }
      else if (a === 'confirm') doConfirm(b);
      else if (a === 'actuals') doActuals(b);
      else if (a === 'cmsave') {
        const r = S.cm.rows.find(x => x.outlet_id === S.cmOpen);
        api('RE_CM_REVIEW', {outlet_id: r.outlet_id, plan_id: r.plan ? r.plan.plan_id : '', flag: r.flag.code, decision: $('cmdec').value, owner: $('cmown').value, next_review: $('cmdate').value, note: $('cmnote').value})
          .then(q2 => { S.cm = q2; render(); toast('Decision recorded'); }).catch(e => toast(em(e), true));
      }
    };
  });
}
/** Re-render without losing the scroll position (plan edits happen mid-page). */
function keep(fn) { const y = window.scrollY; const open = Array.from(document.querySelectorAll('details')).map(d => d.open); fn(); document.querySelectorAll('details').forEach((d, i) => { if (open[i]) d.open = true; }); window.scrollTo(0, y); }
if (document.readyState !== 'loading') start(); else document.addEventListener('DOMContentLoaded', start);
})();
</script>
